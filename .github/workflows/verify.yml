name: verify

# O portao obrigatorio do projeto, do lado que nao da para contornar. O hook
# local guard-dados-sensiveis.sh e PreToolUse: protege contra o agente, mas nao
# roda em commit feito fora do Claude Code nem pela interface web do GitHub.

on:
  pull_request:
  push:
    branches: [main]

# So a ultima execucao de cada ref interessa.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # node-version-file resolve no CI o mesmo problema que `nvm use` resolve
      # na maquina do operador: garante a versao fixada em .nvmrc e engines.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # A cadeia inteira, na ordem de scripts.verify, no package.json — a
      # composicao vive la, e so la: a lista que este comentario repetia ficou
      # sem test:portas. As regressoes de guard rodam antes do codigo —
      # verificar a protecao antes de verificar o codigo.
      - name: Portao de qualidade
        run: npm run verify
